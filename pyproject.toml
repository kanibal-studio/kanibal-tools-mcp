[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kanibal-tools-mcp"
dynamic = ["version"]
description = "MCP server with four local, read-only tools: French telemarketing consent, cost per kept meeting, GDPR offshore checklist, least-cost capable model."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ALTA VISTA360, S.L.U." }]
keywords = ["mcp", "model-context-protocol", "gdpr", "rgpd", "consent", "lead-generation", "llm", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=1.12,<2",
    "demarchage-consent>=0.2.0",
    "cost-per-kept-meeting>=0.1.2",
    "rgpd-offshore-check>=0.1.2",
    "least-cost-capable>=0.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kanibal-tools-mcp = "kanibal_tools_mcp.server:main"

[project.urls]
Homepage = "https://github.com/kanibal-studio/kanibal-tools-mcp"
Issues = "https://github.com/kanibal-studio/kanibal-tools-mcp/issues"
PyPI = "https://pypi.org/project/kanibal-tools-mcp/"

[tool.setuptools]
packages = ["kanibal_tools_mcp"]

[tool.setuptools.dynamic]
version = { attr = "kanibal_tools_mcp.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
