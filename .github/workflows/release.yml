name: Release to PyPI and the MCP Registry

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  ci:
    # Nothing is published if the tests or the build fail.
    uses: ./.github/workflows/ci.yml

  publish-pypi:
    needs: ci
    runs-on: ubuntu-latest
    # GitHub environment "pypi": maintainer approval is required before any
    # publication, v* tags only. The PyPI trusted publisher is bound to it.
    environment:
      name: pypi
      url: https://pypi.org/project/kanibal-tools-mcp/
    permissions:
      id-token: write  # Trusted Publishing (OIDC), no stored token
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: The tag must match the package version
        run: |
          version="$(python -c 'import kanibal_tools_mcp; print(kanibal_tools_mcp.__version__)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-mcp-registry:
    # The registry verifies the "mcp-name:" line of the README now on PyPI,
    # then grants io.github.kanibal-studio/* through the GitHub OIDC token.
    # It runs only after the approved PyPI job, so it needs no second approval.
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Wait until PyPI serves this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/kanibal-tools-mcp/${version}/json" > /dev/null; then exit 0; fi
            sleep 10
          done
          echo "::error::kanibal-tools-mcp ${version} not visible on PyPI after 5 minutes"
          exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
